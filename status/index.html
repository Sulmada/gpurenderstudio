<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPU Render Studio – Job Status</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #0b0b0b;
    color: #e0e0e0;
}

h1, h2 {
    margin: 0 0 20px 0;
    font-weight: 700;
    text-shadow: 0 0 12px rgba(0,255,255,0.15);
}

section {
    padding: 90px 20px;
}

.content-box {
    max-width: 900px;
    margin: auto;
    background: rgba(20,20,20,0.65);
    padding: 40px 50px;
    border-radius: 14px;
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.04);
    box-shadow: 0 0 50px rgba(0,255,255,0.05);
    animation: fadein 1.2s forwards;
}

@keyframes fadein {
    from { opacity: 0; transform: translateY(40px); }
    to   { opacity: 1; transform: translateY(0); }
}

.hero {
    position: relative;
    height: 55vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.hero video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.55);
}

.hero-content {
    position: relative;
    z-index: 2;
}

.hero-content h1 {
    font-size: 42px;
}

.hero-content p {
    font-size: 18px;
    opacity: 0.85;
}

.status-line {
    margin: 10px 0;
    font-size: 16px;
}

.status-value {
    font-weight: bold;
    color: #baffff;
}

.status-fail {
    color: #ff9999;
}

.status-success {
    color: #9affc8;
}

.btn {
    padding: 14px 28px;
    margin-top: 25px;
    background: #0e1818;
    color: #cfffff;
    border: 1px solid #1effff;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

.btn:hover {
    background: #113333;
}

.footer {
    padding: 60px 20px;
    text-align: center;
    font-size: 14px;
    opacity: 0.75;
}
</style>
</head>

<body>

<div class="hero">
    <video autoplay muted loop playsinline
           poster="../assets/images/hero_poster_desktop.jpg">
        <source src="../assets/video/loop_desktop_v9.webm" type="video/webm">
    </video>

    <div class="hero-content">
        <h1>Job Processing Status</h1>
        <p>This page reflects the live execution state of your submission.</p>
    </div>
</div>

<section>
<div class="content-box">

    <h2>Job Status</h2>

    <p class="status-line">
        Job ID:
        <span id="jobId" class="status-value">—</span>
    </p>

    <p class="status-line">
        Status:
        <span id="jobStatus" class="status-value">Waiting…</span>
    </p>

    <p id="failReason" class="status-line status-fail" style="display:none;"></p>

    <p id="priceLine" class="status-line" style="display:none;">
        Final price:
        <span id="finalPrice" class="status-value">—</span>
    </p>

    <!-- NEW: payment timestamp -->
    <p id="paymentLine" class="status-line" style="display:none;"></p>

    <div id="actionArea"></div>

</div>
</section>

<div class="footer">
    GPU Render Studio – Automated rendering platform<br>
    Sweden
</div>

<script>
(function () {

const params = new URLSearchParams(window.location.search);
const jobId = params.get("job_id");

const API_BASE = location.hostname === "localhost"
    ? "http://localhost:3001"
    : "https://api.gpurenderstudio.com";

const jobIdEl     = document.getElementById("jobId");
const statusEl    = document.getElementById("jobStatus");
const failEl      = document.getElementById("failReason");
const priceEl     = document.getElementById("finalPrice");
const priceLine   = document.getElementById("priceLine");
const paymentLine = document.getElementById("paymentLine");
const actionArea  = document.getElementById("actionArea");

if (!jobId) {
    statusEl.textContent = "Missing job_id";
    statusEl.className = "status-value status-fail";
    return;
}

jobIdEl.textContent = jobId;

<script>
const API_BASE = "...";
const jobId = "...";

// ===============================
// Phase 1 execution profiles (human metadata)
// ===============================
const PHASE1_PROFILES = {
    STRICT: {
        label: "Strict",
        runtime: "1.5 hours",
        price: "$0.50",
        purpose: "For small or well-bounded scenes."
    },
    EXTENDED: {
        label: "Extended",
        runtime: "4 hours",
        price: "$2.00",
        purpose: "For larger or more complex scenes."
    },
    FLEXIBLE: {
        label: "Flexible",
        runtime: "8 hours",
        price: "$4.00",
        purpose: "For very long or unpredictable scenes."
    },
    OPEN: {
        label: "Open",
        runtime: "12 hours",
        price: "$5.00",
        purpose: "For heavy or experimental workloads."
    }
};

// ===============================
// Phase 1 Reason Humanizer
// ===============================
const REASON_LABELS = {
    PHASE1_PRESET_VIOLATION: "Phase 1 preset limits exceeded",
    ...
};

// ===============================
// Phase 1 Reason Humanizer
// ===============================
const REASON_LABELS = {
    PHASE1_PRESET_VIOLATION: "Phase 1 preset limits exceeded",
    MEMORY_BUDGET_EXCEEDED: "Memory budget exceeded",
    UNSUPPORTED_VERSION: "Unsupported Blender version",
    MISSING_ASSETS: "Missing assets",
    RENDER_FAILURE: "Render failed",
    UNKNOWN_FAILURE: "Unknown error"
};

// Humanized detail templates (preferred over backend technical details)
const HUMAN_DETAILS = {
    PHASE1_PRESET_VIOLATION: "The project exceeded the limits of the selected profile.",
    MEMORY_BUDGET_EXCEEDED: "The project requires more memory than this profile allows.",
    UNSUPPORTED_VERSION: "This Blender version is not supported in Phase 1.",
    MISSING_ASSETS: "Some external files are missing (such as textures or linked resources).",
    RENDER_FAILURE: "The rendering process could not start or crashed.",
    UNKNOWN_FAILURE: "Something went wrong but could not be classified."
};

function toHumanReason(job) {
    const reason = job.reason || {};
    const compat = job.compat || {};

    // Resolve class in priority order:
    // 1. Phase 1 ReasonObject (reason.class)
    // 2. Legacy fallback (compat.fail_code)
    // 3. Default (UNKNOWN_FAILURE)
    const cls =
        reason.class ||
        compat.fail_code ||
        "UNKNOWN_FAILURE";

    // Resolve label
    const label = REASON_LABELS[cls] || REASON_LABELS.UNKNOWN_FAILURE;

    // Resolve details:
    // A) Preferred: Humanized detail template
    // B) Fallback: backend-provided technical detail
    // C) Otherwise null
    const details =
        HUMAN_DETAILS[cls] ||
        reason.details ||
        compat.customer_action ||
        null;

    // Resolve actions from ReasonObject (optional)
    const actions = Array.isArray(reason.actions) ? reason.actions : [];

    return { class: cls, label, details, actions };
}

// ===============================
// Phase 1 Action Resolver (profile-aware)
// ===============================
function resolveSuggestedAction(job, humanReason) {
    const current = job.pricing_snapshot?.execution_profile;
    if (!current) return null;

    const actions = humanReason.actions || [];

    // Strategy C: If backend suggests profile upgrade → choose next profile
    if (actions.includes("UPGRADE_TO_EXTENDED") && current === "STRICT") {
        return {
            type: "profile_upgrade",
            from: current,
            to: "EXTENDED",
            reason: "The project exceeded the limits of the Strict profile.",
            meta: PHASE1_PROFILES["EXTENDED"]
        };
    }

    // Optional future:
    // if (actions.includes("UPGRADE_TO_FLEXIBLE") && current === "EXTENDED") ...
    // if (actions.includes("UPGRADE_TO_OPEN") && current === "FLEXIBLE") ...

    // If no suggested upgrade matched → no frontend action
    return null;
}

async function pollStatus() {
    try {
        const res = await fetch(API_BASE + "/api/status/" + jobId);
        if (!res.ok) return;

        const job = await res.json();

        // Reset UI to known baseline
        statusEl.className = "status-value";
        failEl.style.display = "none";
        priceLine.style.display = "none";
        paymentLine.style.display = "none";
        actionArea.innerHTML = "";
        actionArea.style.display = "none";

        const status = (job.status || "").toLowerCase();
        statusEl.textContent = status.toUpperCase() || "UNKNOWN";

        // Phase 1: show execution profile if available
        if (job.pricing_snapshot && job.pricing_snapshot.execution_profile) {
            const ep = job.pricing_snapshot.execution_profile;
            addLine("Current profile", ep);
        }

        // ==================================================
        // FAILED
        // ==================================================
        if (status === "failed") {
            statusEl.classList.add("status-fail");

            // Phase 1: resolve reason
            const h = toHumanReason(job);

            // Always show Reason
            failEl.style.display = "block";
            failValue.textContent = h.label;

            // Optional: Humanized details
            if (h.details) {
                addLine("Details", h.details);
            }

            // Phase 1: Suggested profile upgrade
            const suggestion = resolveSuggestedAction(job, h);
            if (suggestion && suggestion.type === "profile_upgrade") {
                actionArea.style.display = "block";

                // Header
                const header = document.createElement("div");
                header.style.fontWeight = "bold";
                header.style.marginTop = "12px";
                header.textContent = "Suggested next step:";
                actionArea.appendChild(header);

                // Description
                const desc = document.createElement("div");
                desc.textContent = `Switch from ${suggestion.from} to ${suggestion.to} for higher limits.`;
                actionArea.appendChild(desc);

                // Select button
                const btn = document.createElement("button");
                btn.textContent = `Select ${suggestion.to}`;
                btn.style.marginTop = "8px";
                btn.onclick = () => {
                    window.location.href = `/upload.html?profile=${suggestion.to}`;
                };
                actionArea.appendChild(btn);
            }

            return;
        }

        // ==================================================
        // SUCCESS
        // ==================================================
        if (status === "success") {
            statusEl.classList.add("status-success");

            const priceUsd = job.pricing_snapshot?.price_usd;
            priceEl.textContent =
                typeof priceUsd === "number"
                    ? "$" + priceUsd.toFixed(2)
                    : "—";
            priceLine.style.display = "block";

            // Payment status
            const paid = job.payment?.status === "PAID";
            const paidAt = job.payment?.paid_at;

            if (paid && paidAt) {
                const ts = new Date(paidAt)
                    .toISOString()
                    .replace("T", " ")
                    .slice(0, 16);

                paymentLine.textContent = "Payment confirmed at: " + ts;
                paymentLine.style.display = "block";
            }

            // Action
            actionArea.style.display = "block";
            actionArea.innerHTML = paid
                ? `<button class="btn" onclick="download()">Download output</button>`
                : `<button class="btn" onclick="pay()">Pay to download</button>`;

            return;
        }

        // ==================================================
        // QUEUED / RUNNING / UNKNOWN
        // ==================================================
        statusEl.textContent = status.toUpperCase() || "UNKNOWN";

    } catch (err) {
        console.error("Status polling failed:", err);
    }
}

window.pay = async function () {
    actionArea.textContent = "Starting payment…";

    try {
        const res = await fetch(API_BASE + "/api/pay/" + jobId, { method: "POST" });
        if (!res.ok) throw new Error();

        const data = await res.json();
        location.href = data.checkout_url;
    } catch {
        actionArea.textContent = "Unable to start payment.";
    }
};

window.download = function () {
    window.location.href = API_BASE + "/api/download/" + jobId;
};

pollStatus();
setInterval(pollStatus, 4000);

</script>

</body>
</html>
