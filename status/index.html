<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPU Render Studio – Job Status</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #0b0b0b;
    color: #e0e0e0;
}

    #previewPlayer {
        background: black;
    }

h1, h2 {
    margin: 0 0 20px 0;
    font-weight: 700;
    text-shadow: 0 0 12px rgba(0,255,255,0.15);
}

section {
    padding: 90px 20px;
}

.content-box {
    max-width: 900px;
    margin: auto;
    background: rgba(20,20,20,0.65);
    padding: 40px 50px;
    border-radius: 14px;
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.04);
    box-shadow: 0 0 50px rgba(0,255,255,0.05);
    animation: fadein 1.2s forwards;
}

@keyframes fadein {
    from { opacity: 0; transform: translateY(40px); }
    to   { opacity: 1; transform: translateY(0); }
}

.hero {
    position: relative;
    height: 55vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.hero video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.55);
}

.hero-content {
    position: relative;
    z-index: 2;
}

.hero-content h1 {
    font-size: 42px;
}

.hero-content p {
    font-size: 18px;
    opacity: 0.85;
}

.status-line {
    margin: 10px 0;
    font-size: 16px;
}

.status-value {
    font-weight: bold;
    color: #baffff;
}

.status-fail {
    color: #ff9999;
}

.status-success {
    color: #9affc8;
}

.status-wait {
    color: #cfffff;
    opacity: 0.95;
}

.btn {
    padding: 14px 28px;
    margin-top: 25px;
    background: #0e1818;
    color: #cfffff;
    border: 1px solid #1effff;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

.btn:hover {
    background: #113333;
}

.footer {
    padding: 60px 20px;
    text-align: center;
    font-size: 14px;
    opacity: 0.75;
}

.status-grid {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 40px;
}

.status-right h3 {
    margin-top: 0;
}

.progress-bar-wrap {
    height: 16px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    overflow: hidden;
    margin-top: 10px;
}

#progressBar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,#00ffff,#6affff);
    transition: width 0.6s ease;
}

#progressText,
#progressEta {
    margin-top: 8px;
    font-size: 14px;
    opacity: 0.9;
}

</style>
</head>

<body>

<div class="hero">
    <video autoplay muted loop playsinline
           poster="../assets/images/hero_poster_desktop.jpg">
        <source src="../assets/video/loop_desktop_v9.webm" type="video/webm">
    </video>

    <div class="hero-content">
        <h1>Your Render Is Running</h1>
        <p>Track progress, cost and delivery in real time.</p>
    </div>
</div>

<section>
<div class="content-box status-grid">
<div class="status-left">

    <h2>Job Status</h2>

    <p class="status-line">
        Job ID:
        <span id="jobId" class="status-value">—</span>
    </p>

    <p class="status-line">
        Status:
        <span id="jobStatus" class="status-value">Waiting…</span>
    </p>

    <p id="failReason" class="status-line status-fail" style="display:none;"></p>

    <p id="priceLine" class="status-line" style="display:none;">
        Final price:
        <span id="finalPrice" class="status-value">—</span>
    </p>

    <p id="paymentLine" class="status-line" style="display:none;"></p>

    <div id="actionArea"></div>

    <a id="newUploadBtn"
       class="btn"
       href="../"
       style="display:none; background:#141414; border-color:#2fffff;">
       Start a new upload
    </a>

    
</div> <!-- status-left -->
<div class="status-right" id="progressPanel" style="display:none;">

    <div id="progressArea">
        <h3>Progress</h3>

        <div class="progress-bar-wrap">
            <div id="progressBar"></div>
        </div>

        <div id="progressText"></div>
        <div id="progressEta"></div>
    </div>

    <div id="previewArea" style="display:none;">
        <h3>Preview</h3>

        <video id="previewPlayer"
               autoplay
               muted
               loop
               playsinline
               controls
               style="width:100%; border-radius:8px;">
        </video>
    </div>

</div>
</div>
</section>

<div class="footer">
    GPU Render Studio – Automated rendering platform<br>
    Sweden
</div>

<script>
(function () {

const params = new URLSearchParams(window.location.search);
const jobId = params.get("job_id");
const accessTokenFromUrl = params.get("access_token");
const paidHint = params.get("paid") === "1";

const API_BASE = location.hostname === "localhost"
    ? "http://localhost:3001"
    : "https://api.gpurenderstudio.com";

const jobIdEl     = document.getElementById("jobId");
const statusEl    = document.getElementById("jobStatus");
const failEl      = document.getElementById("failReason");
const priceEl     = document.getElementById("finalPrice");
const priceLine   = document.getElementById("priceLine");
const paymentLine = document.getElementById("paymentLine");
const actionArea  = document.getElementById("actionArea");
const newUploadBtn = document.getElementById("newUploadBtn");
const progressPanel = document.getElementById("progressPanel");
const progressBar   = document.getElementById("progressBar");
const progressText  = document.getElementById("progressText");
const progressEta   = document.getElementById("progressEta");
const progressArea  = document.getElementById("progressArea");
const previewArea   = document.getElementById("previewArea");
const previewPlayer = document.getElementById("previewPlayer");

function getStoredJobToken(jobId) {
  if (!jobId) return null;
  return localStorage.getItem("job_token_" + jobId);
}

function storeJobToken(jobId, token) {
  if (!jobId || !token) return;
  localStorage.setItem("job_token_" + jobId, token);
}

if (jobId && accessTokenFromUrl) {
  storeJobToken(jobId, accessTokenFromUrl);
}

const jobToken = accessTokenFromUrl || getStoredJobToken(jobId);

if (!jobId) {
    statusEl.textContent = "Missing job_id";
    statusEl.className = "status-value status-fail";
    return;
}

if (!jobToken) {
    statusEl.textContent = "Missing access token";
    statusEl.className = "status-value status-fail";
    failEl.style.display = "block";
    failEl.textContent = "This job requires its original access link. Open the link from upload confirmation or completion email.";
    return;
}

jobIdEl.textContent = jobId;

// ===============================
// Phase 1 execution profiles (human metadata)
// ===============================
const PHASE1_PROFILES = {
    STRICT: {
        label: "Strict",
        runtime: "1.5 hours",
        price: "$0.50",
        purpose: "For small or well-bounded scenes."
    },
    EXTENDED: {
        label: "Extended",
        runtime: "4 hours",
        price: "$2.00",
        purpose: "For larger or more complex scenes."
    },
    FLEXIBLE: {
        label: "Flexible",
        runtime: "8 hours",
        price: "$4.00",
        purpose: "For very long or unpredictable scenes."
    },
    OPEN: {
        label: "Open",
        runtime: "12 hours",
        price: "$5.00",
        purpose: "For heavy or experimental workloads."
    }
};

// ===============================
// Status Copy (human friendly)
// ===============================
const STATUS_COPY = {
    queued: "Waiting for an available GPU. Rendering will start automatically.",
    running: "Rendering on GPU. Live progress updates below.",
    success: "Rendering complete. Your files are ready.",
    partial_success: "Time limit reached. Partial output is ready.",
    paused_cap: "Paused because your spending limit was reached.",
    failed: "The job could not be completed. No charge was applied."
};

const STOP_REASON_COPY = {
    BUDGET: "Reached the selected profile limit.",
    CAP: "Reached your spending limit.",
    FAILED: "Render failed.",
    USER_CANCEL: "Cancelled by user."
};

// ===============================
// Phase 1 Reason Humanizer
// ===============================
const REASON_LABELS = {
    PHASE1_PRESET_VIOLATION: "Phase 1 preset limits exceeded",
    MEMORY_BUDGET_EXCEEDED: "Memory budget exceeded",
    UNSUPPORTED_VERSION: "Unsupported Blender version",
    MISSING_ASSETS: "Missing assets",
    RENDER_FAILURE: "Render failed",
    UNKNOWN_FAILURE: "Unknown error"
};

const HUMAN_DETAILS = {
    PHASE1_PRESET_VIOLATION: "The project exceeded the limits of the selected profile.",
    MEMORY_BUDGET_EXCEEDED: "The project requires more memory than this profile allows.",
    UNSUPPORTED_VERSION: "This Blender version is not supported in Phase 1.",
    MISSING_ASSETS: "Some external files are missing (such as textures or linked resources).",
    RENDER_FAILURE: "The rendering process could not start or crashed.",
    UNKNOWN_FAILURE: "Something went wrong but could not be classified."
};

function toHumanReason(job) {
    const reason = job.reason || {};
    const compat = job.compat || {};

    const cls =
        reason.class ||
        compat.fail_code ||
        "UNKNOWN_FAILURE";

    const label = REASON_LABELS[cls] || REASON_LABELS.UNKNOWN_FAILURE;

    const details =
        HUMAN_DETAILS[cls] ||
        reason.details ||
        compat.customer_action ||
        null;

    const actions = Array.isArray(reason.actions) ? reason.actions : [];

    return { class: cls, label, details, actions };
}

// ===============================
// Phase 1 Action Resolver (profile-aware)
// ===============================
function resolveSuggestedAction(job, humanReason) {
    const current = job.pricing_snapshot?.execution_profile;
    if (!current) return null;

    const actions = humanReason.actions || [];
    if (!actions.length) return null;

    const actionToProfile = {
        UPGRADE_TO_EXTENDED: "EXTENDED",
        UPGRADE_TO_FLEXIBLE: "FLEXIBLE",
        UPGRADE_TO_OPEN: "OPEN"
    };

    const picked = actions.find(a => actionToProfile[a]);
    if (!picked) return null;

    const target = actionToProfile[picked];
    if (!target || target === current) return null;

    return {
        type: "profile_upgrade",
        from: current,
        to: target,
        reason: "The project exceeded the limits of the selected profile.",
        meta: PHASE1_PROFILES[target] || null
    };
}

// =======================================
// UI dynamic containers
// =======================================
const dynamicInfo = document.createElement("div");
dynamicInfo.id = "dynamicInfo";
paymentLine.parentNode.insertBefore(dynamicInfo, paymentLine);

function addLine(key, value) {
    const line = document.createElement("div");
    line.className = "status-line";
    line.innerHTML = `
        <span class="status-key" style="font-weight:600;">${key}:</span>
        <span class="status-value">${value}</span>
    `;
    dynamicInfo.appendChild(line);
}

function renderSuggestionUpgrade(suggestion) {
    actionArea.style.display = "block";
    actionArea.innerHTML = "";

    const header = document.createElement("div");
    header.style.fontWeight = "bold";
    header.style.marginTop = "12px";
    header.textContent = "Suggested next step:";
    actionArea.appendChild(header);

    const desc = document.createElement("div");
    desc.style.marginTop = "6px";
    desc.textContent = `Switch from ${suggestion.from} to ${suggestion.to} for higher limits.`;
    actionArea.appendChild(desc);

    const meta = suggestion.meta;
    if (meta) {
        const metaLine = document.createElement("div");
        metaLine.style.fontSize = "14px";
        metaLine.style.opacity = "0.85";
        metaLine.style.marginTop = "4px";
        metaLine.textContent = `${meta.label}: ${meta.runtime}, ${meta.price}. ${meta.purpose}`;
        actionArea.appendChild(metaLine);
    }

    const btn = document.createElement("button");
    btn.textContent = `Select ${suggestion.to}`;
    btn.className = "btn";
    btn.style.marginTop = "10px";
    btn.onclick = () => {
        window.location.href = "https://gpurenderstudio.com/#upload?profile=" + suggestion.to;
    };
    actionArea.appendChild(btn);
}

// =======================================
// POLLING WITH BACKOFF (Phase 1.3 safe)
// =======================================
const TERMINAL_STATUSES = ["success", "partial_success", "failed"];
const POLL_INTERVALS = {
    queued: 8000,
    running: 3000,
    paused_cap: 15000
};

let currentDelay = 5000;
let pollTimer = null;

function getDelayForStatus(status) {
    return POLL_INTERVALS[status] || 10000;
}

async function fetchAndRenderOnce() {
  const res = await fetch(
    withAccessToken(API_BASE + "/api/status/" + encodeURIComponent(jobId))
  );

  if (!res.ok) throw new Error("status-fetch-failed-" + res.status);

  const job = await res.json();
  renderJob(job);
  return job;
}

function withAccessToken(url) {
  const sep = url.includes("?") ? "&" : "?";
  return url + sep + "access_token=" + encodeURIComponent(jobToken);
}

async function pollStatusLoop() {
  try {
    const job = await fetchAndRenderOnce();

    const status = (job.status || "").toLowerCase();
    if (TERMINAL_STATUSES.includes(status)) {
      console.log("[STATUS] terminal state reached:", status);
      return;
    }

    currentDelay = getDelayForStatus(status);

  } catch (err) {
    console.warn("[STATUS] fetch error:", err);
    currentDelay = Math.min(currentDelay * 1.5, 30000);
  }

  pollTimer = setTimeout(pollStatusLoop, currentDelay);
}

// =======================================
// RENDER JOB → UI
// =======================================
function renderJob(job) {

    // ---------------------------------------
    // Reset UI
    // ---------------------------------------
    statusEl.className = "status-value";
    failEl.style.display = "none";
    priceLine.style.display = "none";
    paymentLine.style.display = "none";
    actionArea.innerHTML = "";
    actionArea.style.display = "none";
    newUploadBtn.style.display = "none";
    dynamicInfo.innerHTML = "";
    progressPanel.style.display = "none";

    const status = (job.status || "").toLowerCase();
    statusEl.textContent = status ? status.toUpperCase() : "UNKNOWN";

    // ---------------------------------------
    // Common metadata
    // ---------------------------------------
    const currentProfile = job.pricing_snapshot?.execution_profile || null;
    if (currentProfile) {
        addLine("Current profile", currentProfile);
    }

    const stopReason = job.stop_reason || null;
    if (stopReason) {
        addLine("Why it stopped", STOP_REASON_COPY[stopReason] || stopReason);
    }

    const stopMechanism = job.stop_mechanism || null;
    if (stopMechanism) {
        addLine("Stop mechanism", stopMechanism);
    }

    // =======================================
    // FAILED
    // =======================================
    if (status === "failed") {
        statusEl.classList.add("status-fail");

        const h = toHumanReason(job);

        failEl.style.display = "block";
        failEl.textContent = "Reason: " + h.label;

        if (h.details) {
            addLine("Details", h.details);
        }

        const suggestion = resolveSuggestedAction(job, h);
        if (suggestion) {
            renderSuggestionUpgrade(suggestion);
            return;
        }

        if (h.actions && h.actions.length > 0) {
            addLine("Suggested action", h.actions.join(", "));
        }

        return;
    }

    // =======================================
    // PAUSED CAP
    // =======================================
    if (status === "paused_cap") {
        statusEl.classList.add("status-wait");

        addLine(
            "State",
            "Rendering paused because your spending cap was reached."
        );

        const billedUsd = job.billing?.billed_usd;
        if (typeof billedUsd === "number") {
            priceEl.textContent = "$" + billedUsd.toFixed(2);
            priceLine.style.display = "block";
        }

        actionArea.style.display = "block";
        actionArea.innerHTML = `
            <button class="btn" onclick="resumeWithCap()">Increase limit & resume</button>
            <button class="btn" onclick="goUpload()" style="margin-left:10px;">Start new job</button>
        `;

        return;
    }

    // =======================================
    // SUCCESS / PARTIAL_SUCCESS
    // =======================================
    if (status === "success" || status === "partial_success") {
        statusEl.classList.add("status-success");
        document.querySelector(".hero-content h1").textContent =
            "Your Render Is Ready";
    // ---------------------------------------
    // SWITCH RIGHT PANEL: progress → preview
    // ---------------------------------------
    progressPanel.style.display = "block";
    progressArea.style.display = "none";
    previewArea.style.display = "block";

    // load preview
    previewPlayer.src = withAccessToken(
      API_BASE + "/api/preview/" + encodeURIComponent(jobId)
    );

    previewPlayer.load();
    previewPlayer.play().catch(() => {});    

    // if preview missing
    previewPlayer.onerror = function () {
        previewArea.innerHTML =
            "<div style='opacity:0.8;'>Preview not available yet.</div>";
    };
        addLine("Result", "Your render completed successfully.");

        const billedUsd = job.billing?.billed_usd;
        priceEl.textContent =
            typeof billedUsd === "number"
                ? "$" + billedUsd.toFixed(2)
                : "—";
        priceLine.style.display = "block";

        const paid = job.payment?.status === "PAID";
        const paidAt = job.payment?.paid_at;
        const paymentMethod = job.payment?.method;

        if (paid && paidAt) {
            const ts = new Date(paidAt)
                .toISOString()
                .replace("T", " ")
                .slice(0, 16);

            if (paymentMethod === "VOUCHER_FREE") {
                paymentLine.textContent =
                    "Free render unlocked via launch voucher.";
            } else {
                paymentLine.textContent =
                    "Payment confirmed at: " + ts;
            }

            paymentLine.style.display = "block";
        }

        actionArea.style.display = "block";

        if (paid) {
            actionArea.innerHTML = `
                <button class="btn" onclick="downloadVideo()">Download MP4 Video</button>

                <button class="btn"
                        style="margin-left:10px"
                        onclick="downloadFrames()">
                    Download Frames (ZIP)
                </button>
            `;
        } else {
            actionArea.innerHTML = `
                <button class="btn" onclick="pay()">Pay to download</button>
                <div style="margin-top:10px;font-size:13px;opacity:0.8;">
                    Secure Stripe checkout.
                </div>
            `;
        }

        return;
    }

    // =======================================
    // QUEUED
    // =======================================
    if (status === "queued") {
        statusEl.classList.add("status-wait");
        addLine("State", STATUS_COPY.queued);
        return;
    }

    // =======================================
    // RUNNING
    // =======================================
    if (status === "running") {
        statusEl.classList.add("status-wait");
        addLine("State", STATUS_COPY.running);

        if (job.progress) {
            progressPanel.style.display = "block";

            const p = job.progress;

            progressBar.style.width = (p.percent || 0) + "%";

            progressText.textContent =
                `Frames ${p.frames_done}/${p.frames_total} (${p.percent || 0}%)`;

            if (p.eta_seconds) {
                const min = Math.round(p.eta_seconds / 60);
                progressEta.textContent = "ETA: " + min + " min";
            } else {
                progressEta.textContent = "ETA: calculating…";
            }
        }

        return;
    }

    // =======================================
    // FALLBACK
    // =======================================
    statusEl.classList.add("status-wait");
    addLine("Note", "Waiting for job updates…");
}

// ========================================
// PAYMENT + DOWNLOAD ACTIONS
// ========================================

window.pay = async function () {
  actionArea.textContent = "Starting payment…";

  try {
    const res = await fetch(
      withAccessToken(API_BASE + "/api/pay/" + encodeURIComponent(jobId)),
      {
        method: "POST"
      }
    );

    if (!res.ok) {
      throw new Error("payment-init-failed");
    }

    const data = await res.json();

    // ---------------------------------------------------------
    // FREE PATH (no Stripe needed)
    // ---------------------------------------------------------
    if (data && data.checkout_skipped) {
      actionArea.textContent = "Payment completed.";

      // Refresh page so status + download unlock correctly
      const params = new URLSearchParams(window.location.search);
      params.set("job_id", jobId);
      params.set("paid", "1");
      params.set("access_token", jobToken);
      window.location.search = params.toString();
      return;
    }

    // ---------------------------------------------------------
    // Stripe redirect
    // ---------------------------------------------------------
    if (data && data.checkout_url) {
      window.location.href = data.checkout_url;
      return;
    }

    throw new Error("invalid-payment-response");

  } catch (err) {
    console.error("Payment failed:", err);
    actionArea.textContent = "Unable to start payment.";
  }
};

// helper: build download URL with token
function buildDownloadUrl(suffix = "") {
  return withAccessToken(
    API_BASE + "/api/download/" + encodeURIComponent(jobId) + suffix
  );
}

// helper: trigger hidden iframe download
function triggerDownload(url) {
  const iframe = document.createElement("iframe");
  iframe.style.display = "none";
  iframe.src = url;
  document.body.appendChild(iframe);
}

// FULL ARCHIVE (ZIP)
window.download = function () {
  actionArea.innerHTML = "";

  const msg = document.createElement("div");
  msg.className = "status-line";
  msg.textContent = "Download started. Your browser will save the render archive.";
  actionArea.appendChild(msg);

  triggerDownload(
    buildDownloadUrl("/api/download/")
  );

  const againBtn = document.createElement("button");
  againBtn.className = "btn";
  againBtn.style.marginTop = "16px";
  againBtn.textContent = "Render another job";
  againBtn.onclick = () => {
    window.location.href = "https://gpurenderstudio.com/#upload";
  };

  actionArea.appendChild(againBtn);
};

// VIDEO (MP4)
window.downloadVideo = function () {
  triggerDownload(
    withAccessToken(
      API_BASE + "/api/download/" + encodeURIComponent(jobId) + "/video"
    )
  );
};

// FRAMES (ZIP fallback)
window.downloadFrames = function () {
  triggerDownload(
    buildDownloadUrl("/api/download/")
  );
};
// ========================================
// START
// ========================================
if (paidHint) {
  fetchAndRenderOnce()
    .catch(() => {})
    .finally(() => pollStatusLoop());
} else {
  pollStatusLoop();
}

})(); // end IIFE
</script>

</body>
</html>
