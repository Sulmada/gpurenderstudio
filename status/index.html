<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPU Render Studio – Job Status</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #0b0b0b;
    color: #e0e0e0;
}

h1, h2 {
    margin: 0 0 20px 0;
    font-weight: 700;
    text-shadow: 0 0 12px rgba(0,255,255,0.15);
}

section {
    padding: 90px 20px;
}

.content-box {
    max-width: 900px;
    margin: auto;
    background: rgba(20,20,20,0.65);
    padding: 40px 50px;
    border-radius: 14px;
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.04);
    box-shadow: 0 0 50px rgba(0,255,255,0.05);
    animation: fadein 1.2s forwards;
}

@keyframes fadein {
    from { opacity: 0; transform: translateY(40px); }
    to   { opacity: 1; transform: translateY(0); }
}

.hero {
    position: relative;
    height: 55vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.hero video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.55);
}

.hero-content {
    position: relative;
    z-index: 2;
}

.hero-content h1 {
    font-size: 42px;
}

.hero-content p {
    font-size: 18px;
    opacity: 0.85;
}

.status-line {
    margin: 10px 0;
    font-size: 16px;
}

.status-value {
    font-weight: bold;
    color: #baffff;
}

.status-fail {
    color: #ff9999;
}

.status-success {
    color: #9affc8;
}

.btn {
    padding: 14px 28px;
    margin-top: 25px;
    background: #0e1818;
    color: #cfffff;
    border: 1px solid #1effff;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

.btn:hover {
    background: #113333;
}

.footer {
    padding: 60px 20px;
    text-align: center;
    font-size: 14px;
    opacity: 0.75;
}
</style>
</head>

<body>

<div class="hero">
    <video autoplay muted loop playsinline
           poster="../assets/images/hero_poster_desktop.jpg">
        <source src="../assets/video/loop_desktop_v9.webm" type="video/webm">
    </video>

    <div class="hero-content">
        <h1>Job Processing Status</h1>
        <p>This page reflects the live execution state of your submission.</p>
    </div>
</div>

<section>
<div class="content-box">

    <h2>Job Status</h2>

    <p class="status-line">
        Job ID:
        <span id="jobId" class="status-value">—</span>
    </p>

    <p class="status-line">
        Status:
        <span id="jobStatus" class="status-value">Waiting…</span>
    </p>

    <p id="failReason" class="status-line status-fail" style="display:none;"></p>

    <p id="priceLine" class="status-line" style="display:none;">
        Final price:
        <span id="finalPrice" class="status-value">—</span>
    </p>

    <!-- NEW: payment timestamp -->
    <p id="paymentLine" class="status-line" style="display:none;"></p>

    <div id="actionArea"></div>

</div>
</section>

<div class="footer">
    GPU Render Studio – Automated rendering platform<br>
    Sweden
</div>

<script>
(function () {

const params = new URLSearchParams(window.location.search);
const jobId = params.get("job_id");

const API_BASE = location.hostname === "localhost"
    ? "http://localhost:3001"
    : "https://api.gpurenderstudio.com";

const jobIdEl     = document.getElementById("jobId");
const statusEl    = document.getElementById("jobStatus");
const failEl      = document.getElementById("failReason");
const priceEl     = document.getElementById("finalPrice");
const priceLine   = document.getElementById("priceLine");
const paymentLine = document.getElementById("paymentLine");
const actionArea  = document.getElementById("actionArea");

if (!jobId) {
    statusEl.textContent = "Missing job_id";
    statusEl.className = "status-value status-fail";
    return;
}

jobIdEl.textContent = jobId;

// ===============================
// Phase 1 Reason Humanizer
// ===============================
const REASON_LABELS = {
    PHASE1_PRESET_VIOLATION: "Phase 1 preset limits exceeded",
    MEMORY_BUDGET_EXCEEDED: "Memory budget exceeded",
    UNSUPPORTED_VERSION: "Unsupported Blender version",
    MISSING_ASSETS: "Missing assets",
    RENDER_FAILURE: "Render failed",
    UNKNOWN_FAILURE: "Unknown error"
};

// Humanized detail templates (preferred over backend technical details)
const HUMAN_DETAILS = {
    PHASE1_PRESET_VIOLATION: "The project exceeded the limits of the selected profile.",
    MEMORY_BUDGET_EXCEEDED: "The project requires more memory than this profile allows.",
    UNSUPPORTED_VERSION: "This Blender version is not supported in Phase 1.",
    MISSING_ASSETS: "Some external files are missing (such as textures or linked resources).",
    RENDER_FAILURE: "The rendering process could not start or crashed.",
    UNKNOWN_FAILURE: "Something went wrong but could not be classified."
};

function toHumanReason(job) {
    const reason = job.reason || {};
    const compat = job.compat || {};

    // Resolve class in priority order:
    // 1. Phase 1 ReasonObject (reason.class)
    // 2. Legacy fallback (compat.fail_code)
    // 3. Default (UNKNOWN_FAILURE)
    const cls =
        reason.class ||
        compat.fail_code ||
        "UNKNOWN_FAILURE";

    // Resolve label
    const label = REASON_LABELS[cls] || REASON_LABELS.UNKNOWN_FAILURE;

    // Resolve details:
    // A) Preferred: Humanized detail template
    // B) Fallback: backend-provided technical detail
    // C) Otherwise null
    const details =
        HUMAN_DETAILS[cls] ||
        reason.details ||
        compat.customer_action ||
        null;

    // Resolve actions from ReasonObject (optional)
    const actions = Array.isArray(reason.actions) ? reason.actions : [];

    return { class: cls, label, details, actions };
}

async function pollStatus() {
    try {
        const res = await fetch(API_BASE + "/api/status/" + jobId);
        if (!res.ok) return;

        const job = await res.json();

        // Reset UI
        statusEl.className = "status-value";
        failEl.style.display = "none";
        priceLine.style.display = "none";
        paymentLine.style.display = "none";
        actionArea.innerHTML = "";

        // Status
        const status = (job.status || "").toLowerCase();
        statusEl.textContent = status.toUpperCase() || "UNKNOWN";

        // Phase 1: Current Profile (execution profile)
        if (job.pricing_snapshot && job.pricing_snapshot.execution_profile) {
            const ep = job.pricing_snapshot.execution_profile;
            addLine("Current profile", ep);
        }

        // Phase 1 Reason resolve
        const h = toHumanReason(job);

        // Always show Reason line
        failEl.style.display = "block";
        failValue.textContent = h.label;

        // Phase 1: Humanized Details
        if (h.details) {
            addLine("Details", h.details);
        }

    } catch (err) {
        console.error("Status polling failed:", err);
    }
}

        // ==================================================
        // FAILED
        // ==================================================
        if (status === "failed") {
            statusEl.classList.add("status-fail");

            const reason = job.reason || null;
            const compat = job.compat || {};

            // Prioriterad reason-resolver
            const text =
                (reason && reason.details) ||
                (reason && reason.class) ||
                compat.customer_action ||
                compat.fail_code ||
                "UNKNOWN_ERROR";

            failEl.textContent = "Reason: " + text;
            failEl.style.display = "block";

            // Visa actions om de finns
            if (reason && Array.isArray(reason.actions) && reason.actions.length > 0) {
                actionArea.innerHTML =
                    `<div style="margin-top:15px;">
                        Suggested action: <b>${reason.actions.join(", ")}</b>
                    </div>`;
            }

            return;
        }

        // ==================================================
        // SUCCESS
        // ==================================================
        if (status === "success") {
            statusEl.classList.add("status-success");

            // --- price ---
            const priceUsd = job.pricing_snapshot?.price_usd;
            priceEl.textContent =
                typeof priceUsd === "number"
                    ? "$" + priceUsd.toFixed(2)
                    : "—";

            priceLine.style.display = "block";

            // --- payment ---
            const paid = job.payment?.status === "PAID";
            const paidAt = job.payment?.paid_at;

            if (paid && paidAt) {
                const ts = new Date(paidAt)
                    .toISOString()
                    .replace("T", " ")
                    .slice(0, 16);

                paymentLine.textContent = "Payment confirmed at: " + ts;
                paymentLine.style.display = "block";
            }

            // --- action ---
            actionArea.innerHTML = paid
                ? `<button class="btn" onclick="download()">Download output</button>`
                : `<button class="btn" onclick="pay()">Pay to download</button>`;

            return;
        }

        // ==================================================
        // QUEUED / RUNNING / UNKNOWN
        // ==================================================
        statusEl.textContent = status.toUpperCase() || "UNKNOWN";

    } catch {
        /* silent by design */
    }
}

window.pay = async function () {
    actionArea.textContent = "Starting payment…";

    try {
        const res = await fetch(API_BASE + "/api/pay/" + jobId, { method: "POST" });
        if (!res.ok) throw new Error();

        const data = await res.json();
        location.href = data.checkout_url;
    } catch {
        actionArea.textContent = "Unable to start payment.";
    }
};

window.download = function () {
    window.location.href = API_BASE + "/api/download/" + jobId;
};

pollStatus();
setInterval(pollStatus, 4000);

})();
</script>

</body>
</html>
