<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPU Render Studio – Job Status</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #0b0b0b;
    color: #e0e0e0;
}

h1, h2 {
    margin: 0 0 20px 0;
    font-weight: 700;
    text-shadow: 0 0 12px rgba(0,255,255,0.15);
}

section {
    padding: 90px 20px;
}

.content-box {
    max-width: 900px;
    margin: auto;
    background: rgba(20,20,20,0.65);
    padding: 40px 50px;
    border-radius: 14px;
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.04);
    box-shadow: 0 0 50px rgba(0,255,255,0.05);
    animation: fadein 1.2s forwards;
}

@keyframes fadein {
    from { opacity: 0; transform: translateY(40px); }
    to   { opacity: 1; transform: translateY(0); }
}

.hero {
    position: relative;
    height: 55vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.hero video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.55);
}

.hero-content {
    position: relative;
    z-index: 2;
}

.hero-content h1 {
    font-size: 42px;
}

.hero-content p {
    font-size: 18px;
    opacity: 0.85;
}

.status-line {
    margin: 10px 0;
    font-size: 16px;
}

.status-value {
    font-weight: bold;
    color: #baffff;
}

.status-fail {
    color: #ff9999;
}

.status-success {
    color: #9affc8;
}

.btn {
    padding: 14px 28px;
    margin-top: 25px;
    background: #0e1818;
    color: #cfffff;
    border: 1px solid #1effff;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

.btn:hover {
    background: #113333;
}

.footer {
    padding: 60px 20px;
    text-align: center;
    font-size: 14px;
    opacity: 0.75;
}
</style>
</head>

<body>

<div class="hero">
    <video autoplay muted loop playsinline
           poster="../assets/images/hero_poster_desktop.jpg">
        <source src="../assets/video/loop_desktop_v9.webm" type="video/webm">
    </video>

    <div class="hero-content">
        <h1>Job Processing Status</h1>
        <p>This page reflects the live execution state of your submission.</p>
    </div>
</div>

<section>
<div class="content-box">

    <h2>Job Status</h2>

    <p class="status-line">
        Job ID:
        <span id="jobId" class="status-value">—</span>
    </p>

    <p class="status-line">
        Status:
        <span id="jobStatus" class="status-value">Waiting…</span>
    </p>

    <p id="failReason" class="status-line status-fail" style="display:none;"></p>

    <p id="priceLine" class="status-line" style="display:none;">
        Final price:
        <span id="finalPrice" class="status-value">—</span>
    </p>

    <div id="actionArea"></div>

</div>
</section>

<div class="footer">
    GPU Render Studio – Automated rendering platform<br>
    Sweden
</div>

<script>
(function () {

const params = new URLSearchParams(window.location.search);
const jobId = params.get("job_id");

const API_BASE = location.hostname === "localhost"
    ? "http://localhost:3001"
    : "https://api.gpurenderstudio.com";

const jobIdEl    = document.getElementById("jobId");
const statusEl   = document.getElementById("jobStatus");
const failEl     = document.getElementById("failReason");
const priceEl    = document.getElementById("finalPrice");
const priceLine  = document.getElementById("priceLine");
const actionArea = document.getElementById("actionArea");

if (!jobId) {
    statusEl.textContent = "Missing job_id";
    statusEl.className = "status-value status-fail";
    return;
}

jobIdEl.textContent = jobId;

async function pollStatus() {
    try {
        const res = await fetch(API_BASE + "/api/status/" + jobId);
        if (!res.ok) return;

        const job = await res.json();

        statusEl.textContent = job.status.toUpperCase();

        if (job.status === "failed") {
            statusEl.className = "status-value status-fail";
            failEl.style.display = "block";
            failEl.textContent =
                "Reason: " + job.fail_code +
                (job.customer_action ? " – " + job.customer_action : "");
            priceLine.style.display = "none";
            actionArea.innerHTML = "";
        }

        if (job.status === "success") {
            statusEl.className = "status-value status-success";

            const price =
                typeof job.pricing_snapshot?.price_usd === "number"
                    ? "$" + job.pricing_snapshot.price_usd.toFixed(2)
                    : "—";

            priceEl.textContent = price;
            priceLine.style.display = "block";

            const paid = job.payment?.status === "PAID";

            actionArea.innerHTML = paid
                ? `<button class="btn">Download output</button>`
                : `<button class="btn" onclick="pay()">Pay to download</button>`;
        }

    } catch (_) {
        /* silent by design */
    }
}

window.pay = async function () {
    actionArea.textContent = "Starting payment…";

    try {
        const res = await fetch(API_BASE + "/api/pay/" + jobId, { method: "POST" });
        if (!res.ok) throw new Error();

        const data = await res.json();
        location.href = data.checkout_url;
    } catch {
        actionArea.textContent = "Unable to start payment.";
    }
};

pollStatus();
setInterval(pollStatus, 4000);

})();
</script>

</body>
</html>
