name: SEO homepage link one-shot

on:
  push:
    branches:
      - seo/blender-render-farm

permissions:
  contents: write

jobs:
  patch-homepage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/blender-render-farm

      - name: Add commercial Blender render farm links to homepage
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if '/blender-render-farm.html' not in s:
              pattern = r'(<a href="#upload">\s*<button class="btn btn-primary" id="heroMainBtn">Get my render estimate</button>\s*</a>)(\s*)(<a href="#workflow">)'
              replacement = r'''\1\2<a href="/blender-render-farm.html">
                <button class="btn">Blender render farm</button>
            </a>\2\3'''
              s, n = re.subn(pattern, replacement, s, count=1)
              if n != 1:
                  raise SystemExit('Could not safely insert hero link')

          old = 'A focused automated service for creators who need more GPU capacity without buying and maintaining another workstation.'
          new = 'A focused <a href="/blender-render-farm.html">Blender render farm and GPU rendering service</a> for creators who need more GPU capacity without buying and maintaining another workstation.'
          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/seo-homepage-link-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Link homepage to Blender render farm landing page"
          git push origin HEAD:seo/blender-render-farm
