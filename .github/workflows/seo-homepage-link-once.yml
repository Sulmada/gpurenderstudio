name: SEO homepage link one-shot

on:
  push:
    branches:
      - seo/blender-render-farm

permissions:
  contents: write

jobs:
  patch-homepage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/blender-render-farm

      - name: Add commercial Blender render farm links to homepage
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''        <div class="hero-actions">
              <a href="#upload">
                  <button class="btn btn-primary" id="heroMainBtn">Get my render estimate</button>
              </a>
              <a href="#workflow">
                  <button class="btn">See how it works</button>
              </a>
          </div>
          '''
          new = '''        <div class="hero-actions">
              <a href="#upload">
                  <button class="btn btn-primary" id="heroMainBtn">Get my render estimate</button>
              </a>
              <a href="/blender-render-farm.html">
                  <button class="btn">Blender render farm</button>
              </a>
              <a href="#workflow">
                  <button class="btn">See how it works</button>
              </a>
          </div>
          '''
          if old not in s:
              raise SystemExit('Hero action block not found; refusing unsafe patch')
          s = s.replace(old, new, 1)

          old2 = '''    <p class="section-intro">A focused automated service for creators who need more GPU capacity without buying and maintaining another workstation.</p>'''
          new2 = '''    <p class="section-intro">A focused <a href="/blender-render-farm.html">Blender render farm and GPU rendering service</a> for creators who need more GPU capacity without buying and maintaining another workstation.</p>'''
          if old2 not in s:
              raise SystemExit('Trust intro not found; refusing unsafe patch')
          s = s.replace(old2, new2, 1)

          p.write_text(s, encoding='utf-8')

      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/seo-homepage-link-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Link homepage to Blender render farm landing page"
          git push origin HEAD:seo/blender-render-farm
