name: Center hero once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/center-hero-once.yml'

permissions:
  contents: write

jobs:
  center-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Center desktop hero
        run: |
          grep -q 'justify-content: flex-start;' index.html
          grep -q 'max-width: 1180px;' index.html
          grep -q 'text-align: left;' index.html
          sed -i 's/justify-content: flex-start;/justify-content: center;/' index.html
          sed -i 's/text-align: left;/text-align: center;/g' index.html
          sed -i 's/max-width: 1180px;/max-width: 900px;/' index.html
          sed -i 's/margin: 0 0 24px;/margin: 0 auto 24px;/g' index.html
          sed -i 's/.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 18px; }/.hero-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 0 0 18px; }/' index.html
          sed -i 's/max-width: 760px;/max-width: 760px; margin: 0 auto;/' index.html

      - name: Verify hero centering
        run: |
          grep -q 'justify-content: center;' index.html
          grep -q 'max-width: 900px;' index.html
          grep -q 'margin: 0 auto 24px;' index.html
          grep -q 'justify-content: center; gap: 12px;' index.html

      - name: Remove one-time workflow
        run: rm .github/workflows/center-hero-once.yml

      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/center-hero-once.yml
          git commit -m 'Center homepage hero content'
          git push
